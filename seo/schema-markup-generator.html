<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="author" content="Famral" />
    <meta name="theme-color" content="#0067b8" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload"

        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    </noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7876432493491415"
        crossorigin="anonymous"></script>

    <!-- Google Analytics (gtag.js) -->

    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-H57NCR0QYN');
    </script>


    <!-- Custom Tool Stylesheet -->
    <style>
        /* ── CSS Reset & Variables ── */
        :root {
            --primary: #0067b8;
            --primary-hover: #005da6;
            --primary-dark: #004b87;
            --primary-light: #eff6ff;
            --primary-light-border: #bfdbfe;
            --primary-focus: rgba(0, 103, 184, 0.2);

            --text-dark: #0f172a;
            --text-medium: #334155;
            --text-muted: #64748b;
            --text-light: #94a3b8;

            --surface-body: #f8fafc;
            --surface-card: #ffffff;
            --surface-alt: #f1f5f9;
            --surface-input: #ffffff;

            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            --border-focus: #0067b8;

            --success: #16a34a;
            --success-light: #dcfce7;
            --warning: #ea580c;
            --warning-light: #ffedd5;
            --danger: #dc2626;
            --danger-light: #fee2e2;

            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;

            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;

            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);

            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--surface-body);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            width: 100%;
        }

        main {
            flex: 1 0 auto;
            width: 100%;
        }

        /* ── Global Layout Wrapper ── */
        .page-container {
            max-width: 1260px;
            margin: 0 auto;
            padding: 0 1.25rem;
            width: 100%;
            box-sizing: border-box;
        }

        @media (max-width: 768px) {
            .page-container {
                padding: 0 1rem;
            }
        }

        @media (max-width: 480px) {
            .page-container {
                padding: 0 0.75rem;
            }
        }

        /* ── Hero Section with Integrated Breadcrumb ── */
        .tool-hero {
            background: linear-gradient(180deg, #ffffff 0%, #f0f7ff 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 0 2rem;
            position: relative;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .hero-breadcrumb {
            margin-bottom: 1.15rem;
            width: 100%;
            max-width: 100%;
        }

        .breadcrumb-list {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.45rem;
            list-style: none;
            font-size: 0.82rem;
            color: var(--text-muted);
            padding: 0;
            margin: 0;
            width: 100%;
            max-width: 100%;
        }

        .breadcrumb-list li {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .breadcrumb-list a {
            color: var(--text-muted);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: var(--transition);
        }

        .breadcrumb-list a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .breadcrumb-sep {
            color: #94a3b8;
            font-size: 0.75rem;
            user-select: none;
            margin: 0 0.1rem;
        }

        .breadcrumb-current {
            color: var(--text-dark);
            font-weight: 600;
        }

        .hero-badge-wrap {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #e0f2fe;
            color: #0369a1;
            padding: 0.3rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.85rem;
            border: 1px solid #bae6fd;
            max-width: 100%;
        }

        .hero-rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-left: 0.65rem;
            margin-bottom: 0.85rem;
            vertical-align: middle;
        }

        .hero-rating-badge .stars {
            color: #f59e0b;
            font-size: 0.8rem;
            display: inline-flex;
            gap: 1px;
        }

        @media (max-width: 520px) {
            .hero-rating-badge {
                margin-left: 0;
                margin-top: -0.35rem;
                margin-bottom: 0.75rem;
                display: flex;
            }
        }

        .tool-hero h1 {
            font-size: 2.35rem;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.2;
            letter-spacing: -0.025em;
            margin-bottom: 0.75rem;
            word-break: break-word;
            width: 100%;
        }

        .tool-hero h1 span {
            color: var(--primary);
        }

        .tool-hero-lead {
            font-size: 1.05rem;
            color: var(--text-muted);
            max-width: 820px;
            margin-bottom: 1.25rem;
            line-height: 1.55;
            width: 100%;
        }

        .hero-action-pills {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            width: 100%;
            max-width: 100%;
        }

        .btn-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.55rem 1rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-dark);
            transition: var(--transition);
            box-sizing: border-box;
            text-decoration: none;
            touch-action: manipulation;
        }

        .btn-pill:hover {
            background: var(--surface-alt);
            border-color: #cbd5e1;
            text-decoration: none;
        }

        .btn-pill-primary {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .btn-pill-primary:hover {
            background: var(--primary-hover);
            color: #ffffff;
            border-color: var(--primary-hover);
        }

        /* ── Workspace Section & Responsive Grid ── */
        .workspace-section {
            padding: 2rem 0 3.5rem;
            width: 100%;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(0, 1.05fr);
            gap: 1.75rem;
            align-items: start;
            width: 100%;
            box-sizing: border-box;
        }

        .form-column,
        .preview-column {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        /* ── Form Card & Controls ── */
        .form-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            width: 100%;
            box-sizing: border-box;
        }

        /* Tab Navigation for Form Categories */
        .form-tab-nav {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.25rem;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }

        .form-tab-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-muted);
            padding: 0.6rem 0.9rem;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            white-space: nowrap;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            position: relative;
            touch-action: manipulation;
        }

        .form-tab-btn:hover {
            color: var(--primary);
            background: var(--primary-light);
        }

        .form-tab-btn.active {
            color: var(--primary);
            background: #ffffff;
            border-bottom: 2px solid var(--primary);
            margin-bottom: -2px;
            font-weight: 700;
        }

        .form-tab-pane {
            display: none;
            animation: fadeIn 0.15s ease-out;
        }

        .form-tab-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 1.25rem;
            padding-bottom: 0.65rem;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .form-section-title i {
            color: var(--primary);
            margin-right: 0.45rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            position: relative;
            width: 100%;
        }

        .form-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-bottom: 0.4rem;
            width: 100%;
        }

        .form-label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-dark);
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            flex-wrap: wrap;
        }

        .tag-badge {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            background: var(--surface-alt);
            color: #475569;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-weight: 500;
            white-space: nowrap;
        }

        .char-counter {
            font-size: 0.74rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
            background: var(--surface-alt);
            color: var(--text-muted);
            transition: var(--transition);
            white-space: nowrap;
            margin-left: auto;
        }

        .char-counter.status-good {
            background: var(--success-light);
            color: #166534;
        }

        .char-counter.status-warn {
            background: var(--warning-light);
            color: #92400e;
        }

        .char-counter.status-danger {
            background: var(--danger-light);
            color: #991b1b;
        }

        .form-input,
        .form-textarea,
        .form-select {
            display: block;
            width: 100% !important;
            min-width: 0 !important;
            max-width: 100% !important;
            padding: 0.65rem 0.85rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--surface-input);
            font-family: inherit;
            font-size: 0.94rem;
            color: var(--text-dark);
            transition: var(--transition);
            outline: none;
            box-sizing: border-box;
            line-height: 1.5;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-focus);
            background: #ffffff;
        }

        .form-textarea {
            resize: vertical;
            min-height: 86px;
        }

        .form-hint {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 0.35rem;
            line-height: 1.4;
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            width: 100%;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.75rem;
            width: 100%;
        }

        /* Segmented Button Group (Index/Noindex, Follow/Nofollow) */
        .segmented-control {
            display: flex;
            background: var(--surface-alt);
            padding: 0.25rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            width: 100%;
            gap: 0.25rem;
        }

        .segmented-btn {
            flex: 1;
            text-align: center;
            padding: 0.45rem 0.65rem;
            font-size: 0.85rem;
            font-weight: 600;
            background: transparent;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            font-family: inherit;
            touch-action: manipulation;
        }

        .segmented-btn.active {
            background: #ffffff;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
            font-weight: 700;
        }

        /* Directives Checklist */
        .directives-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.65rem;
            margin-top: 0.75rem;
        }

        .checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            font-size: 0.82rem;
            color: var(--text-medium);
            cursor: pointer;
            background: var(--surface-alt);
            padding: 0.55rem 0.7rem;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            transition: var(--transition);
        }

        .checkbox-label:hover {
            border-color: var(--border-hover);
            background: #ffffff;
        }

        .checkbox-label input[type="checkbox"] {
            margin-top: 0.15rem;
            accent-color: var(--primary);
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .checkbox-label code {
            font-family: var(--font-mono);
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.8rem;
        }

        /* Color Picker Row */
        .color-picker-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .color-preview-box {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            cursor: pointer;
            padding: 0;
            background: none;
            overflow: hidden;
            flex-shrink: 0;
        }

        .color-preview-box input[type="color"] {
            border: none;
            width: 150%;
            height: 150%;
            margin: -25%;
            cursor: pointer;
        }

        /* Quick Sync Button */
        .btn-sync-action {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.76rem;
            font-weight: 600;
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid var(--primary-light-border);
            padding: 0.3rem 0.65rem;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-sync-action:hover {
            background: #dbeafe;
        }

        /* ── Right Column: Live Previews & Code Box ── */
        .preview-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 1.75rem;
        }

        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            padding-bottom: 0.65rem;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .preview-header h2 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .preview-tabs {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--surface-alt);
            border: 1px solid var(--border-color);
            padding: 0.45rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: inherit;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            touch-action: manipulation;
        }

        .tab-btn:hover {
            background: #ffffff;
            color: var(--text-dark);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* ── 1. Google Search SERP Simulator ── */
        .serp-device-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            background: var(--surface-alt);
            padding: 0.2rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .device-btn {
            border: none;
            background: transparent;
            padding: 0.3rem 0.75rem;
            font-size: 0.76rem;
            font-weight: 600;
            font-family: inherit;
            border-radius: 9999px;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .device-btn.active {
            background: #ffffff;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
            font-weight: 700;
        }

        /* Google SERP Desktop Box */
        .google-serp-desktop {
            background: #ffffff;
            border: 1px solid #dfe1e5;
            border-radius: 8px;
            padding: 1.15rem 1.25rem;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.08);
            font-family: Arial, Roboto, sans-serif;
            line-height: 1.4;
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
            transition: var(--transition);
        }

        .serp-url-row {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            font-size: 0.8125rem;
            color: #202124;
            margin-bottom: 0.35rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .serp-favicon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #f1f3f4;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            color: #5f6368;
            flex-shrink: 0;
            overflow: hidden;
        }

        .serp-favicon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .serp-site-name {
            font-weight: 600;
            color: #202124;
            font-size: 0.85rem;
        }

        .serp-breadcrumb {
            color: #4d5156;
            font-size: 0.78rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .serp-title {
            font-size: 1.25rem;
            line-height: 1.3;
            color: #1a0dab;
            font-weight: 400;
            cursor: pointer;
            margin-bottom: 0.35rem;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .serp-title:hover {
            text-decoration: underline;
        }

        .serp-snippet {
            font-size: 0.875rem;
            color: #4d5156;
            line-height: 1.5;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Google SERP Mobile Box */
        .google-serp-mobile {
            background: #ffffff;
            border: 1px solid #dfe1e5;
            border-radius: 16px;
            padding: 1rem 1.15rem;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.1);
            font-family: Arial, Roboto, sans-serif;
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            display: none;
        }

        .serp-mobile-header {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            margin-bottom: 0.5rem;
        }

        .serp-mobile-thumb {

        /* ── Social Card Previews ── */
        .social-card {
            background: #ffffff;

            width: 100%;
            box-sizing: border-box;
        }

        .preview-img-container {
            width: 100%;
            aspect-ratio: 1.91 / 1;
            background: #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        .preview-img-container img {
            width: 100%;
            height: 100%;

            display: block;
        }

        .fb-content {
            padding: 0.85rem 1rem;
            background: #f0f2f5;
            border-top: 1px solid #e4e6eb;
        }

        .fb-domain {
            font-size: 0.72rem;
            color: #65676b;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.2rem;

        }

        .fb-title {
            font-size: 0.98rem;
            font-weight: 700;
            color: #050505;
            line-height: 1.35;
            margin-bottom: 0.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .fb-desc {
            font-size: 0.82rem;
            color: #65676b;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tw-card {
            border-radius: 14px;
            border: 1px solid #cfd9de;
            background: #ffffff;
        }

        .tw-content {
            padding: 0.8rem 1rem;
        }

        .tw-domain {
            font-size: 0.78rem;
            color: #536471;
            margin-bottom: 0.2rem;
        }

        .tw-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #0f1419;
            line-height: 1.35;
            margin-bottom: 0.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tw-desc {
            font-size: 0.82rem;
            color: #536471;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ── SEO Health Score Card ── */
        .health-score-card {
            background: #ffffff;
            border-radius: var(--radius-md);
            padding: 1.25rem;
            border: 1px solid var(--border-color);
        }

        .health-score-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .score-circle-wrap {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .score-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            font-size: 1.25rem;
            font-weight: 800;
            background: var(--success-light);
            color: var(--success);
            border: 3px solid var(--success);
            font-family: var(--font-mono);
            flex-shrink: 0;
        }

        .checklist-grid {
            display: grid;
            gap: 0.5rem;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            font-size: 0.82rem;
            color: var(--text-medium);
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            background: var(--surface-alt);
        }

        .checklist-item i {
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .checklist-item.pass i {
            color: var(--success);
        }

        .checklist-item.warn i {
            color: var(--warning);
        }

        .checklist-item.fail i {
            color: var(--danger);
        }

        /* ── Code Output Card ── */
        .code-card {
            background: #0f172a;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            border: 1px solid #1e293b;
            width: 100%;
            box-sizing: border-box;
        }

        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .code-title {
            color: #e2e8f0;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-family: var(--font-mono);
        }

        .code-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-code-action {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem 0.75rem;
            font-size: 0.78rem;
            font-weight: 600;
            font-family: inherit;
            border-radius: 4px;
            border: 1px solid #475569;
            background: #334155;
            color: #f8fafc;
            cursor: pointer;
            transition: var(--transition);
            touch-action: manipulation;
        }

        .btn-code-action:hover {
            background: #475569;
            color: #ffffff;
        }

        .btn-code-action.btn-copy-main {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .btn-code-action.btn-copy-main:hover {
            background: var(--primary-hover);
        }

        .code-content-wrapper {
            position: relative;
            max-height: 440px;
            overflow-y: auto;
            background: #090d16;
            scrollbar-width: thin;
        }

        .code-pre {
            margin: 0;
            padding: 1rem 1.25rem;
            font-family: var(--font-mono);
            font-size: 0.84rem;
            line-height: 1.6;
            color: #e2e8f0;
            white-space: pre;
            word-break: normal;
            tab-size: 4;
        }

        /* ── Import Modal ── */
        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal-dialog {
            background: #ffffff;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 620px;
            width: 100%;
            border: 1px solid var(--border-color);
            overflow: hidden;
            animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(8px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.15rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background: var(--surface-body);
        }

        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-modal-close {
            background: none;
            border: none;
            font-size: 1.25rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            transition: var(--transition);
        }

        .btn-modal-close:hover {
            color: var(--text-dark);
            background: var(--surface-alt);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-color);
            background: var(--surface-body);
        }

        /* ── Toast Notification ── */
        .toast-notify {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #0f172a;
            color: #ffffff;
            padding: 0.85rem 1.35rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.65rem;
            z-index: 10000;
            opacity: 0;
            transform: translateY(12px);
            transition: var(--transition);
            pointer-events: none;
        }

        .toast-notify.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast-notify i {
            color: #38bdf8;
            font-size: 1.1rem;
        }

        /* ── Educational / SEO Content Sections ── */
        .content-section {
            padding: 3.5rem 0;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .content-section.alt-bg {
            background: #f8fafc;
        }

        .section-header {
            text-align: center;
            max-width: 780px;
            margin: 0 auto 2.5rem;
            box-sizing: border-box;
        }

        .section-tag {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .section-title {
            font-size: 1.95rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
            word-break: break-word;
        }
        /* Framework Tabs & Implementation Snippets */
        .framework-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 0.25rem;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .framework-tabs::-webkit-scrollbar {
            display: none;
        }

        .framework-tab-btn {
            padding: 0.5rem 1rem;

            font-weight: 600;
            border: 1px solid var(--border-color);
            background: #ffffff;
            border-radius: var(--radius-sm);
            color: var(--text-dark);
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        .framework-tab-btn:hover {
            background: var(--surface-alt);
        }

        .framework-tab-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .framework-pane {
            display: none;
            background: #0f172a;
            border-radius: var(--radius-md);
            padding: 1.5rem;
            overflow-x: auto;
            color: #e2e8f0;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            line-height: 1.6;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-wrap: anywhere;
        }

        .framework-pane.active {
            display: block;
        }

        .token-tag {
            color: #38bdf8;
        }

        .token-attr {
            color: #a78bfa;
        }

        .token-val {
            color: #4ade80;
        }

        .token-comment {
            color: #64748b;
            font-style: italic;
        }

        .info-callout {
            background: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 1.25rem 1.5rem;
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            margin: 1.75rem 0;
        }

        .info-callout h4 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1e40af;
            margin-bottom: 0.45rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .info-callout p {
            color: #1e3a8a;
            margin: 0;
            font-size: 0.96rem;
            line-height: 1.6;
        }

        /* ── FAQ Accordion ── */
        .faq-accordion {
            max-width: 860px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .faq-item {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-bottom: 0.85rem;
            background: #ffffff;
            overflow: hidden;
            transition: var(--transition);
        }

        .faq-item:hover {
            border-color: var(--border-hover);
        }

        .faq-question {
            width: 100%;
            background: none;
            border: none;
            text-align: left;
            padding: 1.15rem 1.35rem;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            font-family: inherit;
            touch-action: manipulation;
        }

        .faq-question i {
            color: var(--primary);
            transition: transform 0.25s ease;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .faq-item.active .faq-question i {
            transform: rotate(180deg);
        }

        .faq-answer {
            display: none;
            padding: 0 1.35rem 1.25rem;
            font-size: 0.98rem;
            color: var(--text-medium);
            line-height: 1.7;
            border-top: 1px solid #f1f5f9;
            margin-top: 0.25rem;
            padding-top: 0.85rem;
        }

        .faq-item.active .faq-answer {
            display: block;
        }

        /* ── Related Tools Banner ── */
        .related-tools-box {
            max-width: 860px;
            margin: 3.5rem auto 0;
            background: linear-gradient(135deg, #eff6ff 0%, #e0f2fe 100%);
            border: 1px solid var(--primary-light-border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.5rem;
            box-sizing: border-box;
            width: 100%;
        }

        .related-tools-content h3 {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 0.4rem;
        }

        .related-tools-content p {
            color: var(--text-medium);
            margin: 0;
            font-size: 0.95rem;
        }

        /* ── Responsive Mobile Rules ── */
        @media (max-width: 992px) {
            .workspace-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .tool-hero h1 {
                font-size: 2.1rem;
            }
        }

        @media (max-width: 768px) {
            .tool-hero {
                padding: 1.75rem 0 2.25rem;
            }

            .tool-hero h1 {
                font-size: 1.75rem;
            }

            .tool-hero-lead {
                font-size: 0.98rem;
                margin-bottom: 1.35rem;
            }

            .form-card,
            .preview-card {
                padding: 1.25rem 1rem;
            }

            .form-row-2,
            .form-row-3,
            .directives-grid {
                grid-template-columns: 1fr;
            }

            .infobox-image-guide {
                grid-template-columns: 1fr;
                padding: 1.5rem 1.25rem;
                gap: 1.5rem;
                margin: 2rem 0;
            }

            .aspect-ratio-diagram {
                padding: 1.15rem;
            }

            .content-section {
                padding: 3rem 0;
            }

            .section-title {
                font-size: 1.7rem;
            }

            .toast-notify {
                left: 1rem;
                right: 1rem;
                bottom: 1rem;
                justify-content: center;
            }

            .related-tools-box {
                padding: 1.5rem 1rem;
            }
        }

        @media (max-width: 480px) {
            .hero-action-pills {
                flex-direction: column;
                width: 100%;
            }

            .btn-pill {
                width: 100%;
                justify-content: center;
            }

            .serp-device-toggle {
                width: 100%;
                justify-content: center;
            }

            .form-tab-btn {
                padding: 0.5rem 0.7rem;
                font-size: 0.82rem;
            }
        }
    </style>
</head>
